<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.overlay {
    display: inline-block;
    min-width: 420px;
    background: rgba(5, 9, 22, 0.92);
    border-radius: 12px;
    padding: 10px 18px;
    color: white;
}

.top {
    display: flex;
    justify-content: space-between;
    font-size: 18px;
    font-weight: bold;
}

.score {
    font-size: 28px;
    font-weight: bold;
    text-align: center;
    margin: 4px 0;
}

.players {
    text-align: center;
    font-size: 13px;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div id="overlay" class="overlay hidden">

    <div class="top">
        <span id="teamA">INDIA</span>
        <span id="teamB">AUSTRALIA</span>
    </div>

    <div id="score" class="score">
        0/0 OV 0.0
    </div>

    <div id="players" class="players">
        Rohit Sharma 0 (0) | Virat Kohli 0 (0)
    </div>

</div>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


const firebaseConfig = {
    databaseURL:
        "https://planning-with-ai-948a8-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const matchRef = ref(
    db,
    "cricketMatch"
);


onValue(matchRef, (snapshot) => {

    const data = snapshot.val();

    if (!data) {
        return;
    }

    const teamA =
        data.teamA ||
        data["Team A"] ||
        "INDIA";

    const teamB =
        data.teamB ||
        data["Team B"] ||
        "AUSTRALIA";

    const scoreA =
        data.scoreA || 0;

    const wicketsA =
        data.wicketsA || 0;

    const oversA =
        data.oversA || "0.0";


    const striker =
        data.striker ||
        "Rohit Sharma";

    const strikerRuns =
        data.strikerRuns || 0;

    const strikerBalls =
        data.strikerBalls || 0;


    const nonStriker =
        data.nonStriker ||
        "Virat Kohli";

    const nonStrikerRuns =
        data.nonStrikerRuns || 0;

    const nonStrikerBalls =
        data.nonStrikerBalls || 0;


    document.getElementById(
        "teamA"
    ).textContent = teamA;


    document.getElementById(
        "teamB"
    ).textContent = teamB;


    document.getElementById(
        "score"
    ).textContent =
        scoreA +
        "/" +
        wicketsA +
        "   OV " +
        oversA;


    document.getElementById(
        "players"
    ).textContent =
        striker +
        " " +
        strikerRuns +
        " (" +
        strikerBalls +
        ")" +
        "   |   " +
        nonStriker +
        " " +
        nonStrikerRuns +
        " (" +
        nonStrikerBalls +
        ")";


    document.getElementById(
        "overlay"
    ).classList.remove("hidden");

});

</script>

</body>
</html>
