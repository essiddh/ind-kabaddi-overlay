<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Kabaddi Live Score Overlay</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    background:transparent;
    color:white;
    overflow:auto;
}

.container{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:15px;
}

h1{
    text-align:center;
    margin:8px 0 4px;
    font-size:26px;
}

.subtitle{
    text-align:center;
    color:#9ca3af;
    margin-bottom:18px;
}

.card{
    background:#171d26;
    border-radius:15px;
    padding:15px;
    margin-bottom:14px;
    border:1px solid #29313d;
}

label{
    display:block;
    color:#aeb7c4;
    font-size:13px;
    margin-bottom:5px;
}

input,
select{
    width:100%;
    padding:12px;
    border-radius:9px;
    border:1px solid #394454;
    background:#0f141b;
    color:white;
    font-size:16px;
    margin-bottom:10px;
    outline:none;
}

button{
    border:0;
    border-radius:10px;
    padding:13px 6px;
    font-size:15px;
    font-weight:bold;
    color:white;
    background:#303a48;
    cursor:pointer;
}

button:active{
    transform:scale(.97);
}

.blue{
    background:#1565c0;
}

.red{
    background:#c62828;
}

.green{
    background:#008f4c;
}

.orange{
    background:#ef6c00;
}

.gray{
    background:#4b5563;
}

.small{
    color:#9ca3af;
    font-size:13px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.scoreboard{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:10px;
    text-align:center;
}

.team-name{
    font-size:18px;
    font-weight:bold;
}

.score{
    font-size:48px;
    font-weight:bold;
    margin-top:5px;
}

.vs{
    font-size:16px;
    color:#9ca3af;
    font-weight:bold;
}

.timer{
    text-align:center;
    font-size:34px;
    font-weight:bold;
    margin-top:15px;
}

.status{
    text-align:center;
    margin-top:8px;
    font-weight:bold;
}

.live-dot{
    display:inline-block;
    width:9px;
    height:9px;
    background:#ef4444;
    border-radius:50%;
    margin-right:5px;
}

.preview{
    background:#05070a;
    border-radius:12px;
    padding:12px;
    overflow:hidden;
}

.preview-title{
    font-size:13px;
    color:#9ca3af;
    margin-bottom:8px;
}

.live-overlay{
    width:100%;
    background:rgba(0,0,0,.90);
    border-radius:8px;
    overflow:hidden;
}

.overlay-main{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 12px;
}

.overlay-team{
    font-size:16px;
    font-weight:bold;
    width:30%;
}

.overlay-team.right{
    text-align:right;
}

.overlay-score{
    font-size:28px;
    font-weight:bold;
    text-align:center;
    white-space:nowrap;
}

.overlay-info{
    padding:7px 10px;
    background:#111827;
    text-align:center;
    font-size:12px;
}

.event{
    padding:9px 10px;
    border-bottom:1px solid #29313d;
    font-size:14px;
}

.event:last-child{
    border-bottom:0;
}

@media(max-width:450px){

    .score{
        font-size:40px;
    }

    .team-name{
        font-size:15px;
    }

    .overlay-team{
        font-size:13px;
    }

    .overlay-score{
        font-size:23px;
    }

}


/* =========================
   TRANSPARENT LIVE OVERLAY
   ========================= */

body.overlay-mode .container{
    position:fixed;
    left:0;
    right:0;
    bottom:0;

    width:100%;
    max-width:none;

    padding:0;
    margin:0;

    background:transparent;
}


/* HIDE CONTROL PANELS */

body.overlay-mode .container > h1,
body.overlay-mode .container > .subtitle,
body.overlay-mode .container > .card{
    display:none;
}


/* SHOW LIVE OVERLAY */

body.overlay-mode .live-overlay{
    position:relative;
    display:block;
    width:100%;
    border-radius:0;
    background:rgba(0,0,0,0.90);
    border-top:2px solid rgba(255,255,255,0.25);
    box-sizing:border-box;
}

body.overlay-mode .live-overlay::before{
    content:"";
    position:absolute;
    top:3px;
    left:8px;
    font-size:11px;
    font-weight:900;
    color:#ff3333;
    z-index:10;
}


/* MAIN SCORE STRIP */

body.overlay-mode .overlay-main{
    min-height:64px;
    padding:5px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-sizing:border-box;
}


/* TEAM NAMES */

body.overlay-mode .overlay-team{
    width:30%;
    font-size:20px;
    font-weight:900;
    white-space:nowrap;
overflow:visible;
text-overflow:clip;
    text-align:center;
    line-height:1.1;
}

body.overlay-mode #overlayTeamA{
    color:#35a7ff;
}

body.overlay-mode #overlayTeamB{
    color:#ff4545;
}


/* SCORE */

body.overlay-mode .overlay-score{
    width:40%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

body.overlay-mode .score-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}

body.overlay-mode .score-separator{
    font-size:26px;
    font-weight:900;
    color:white;
    line-height:1;
    opacity:0.8;
}

body.overlay-mode #overlayScoreA,
body.overlay-mode #overlayScoreB{
    font-size:42px;
    font-weight:900;
    min-width:58px;
    padding:5px 8px;
    border-radius:7px;
    background:rgba(255,255,255,0.10);
    text-align:center;
    line-height:1;
    box-sizing:border-box;
}

body.overlay-mode #overlayScoreA{
    color:#35a7ff;
}

body.overlay-mode #overlayScoreB{
    color:#ff4545;
}


/* TIMER */

body.overlay-mode #overlayTimer{
    font-size:16px;
    font-weight:900;
    margin-top:5px;
    letter-spacing:1px;
    line-height:1;
}


/* LEAD */

body.overlay-mode #overlayLead{
    font-size:12px;
    font-weight:900;
    margin-top:4px;
    text-align:center;
    white-space:nowrap;
}


/* INFO STRIP */

body.overlay-mode .overlay-info{
    width:100%;
    padding:4px 8px;
    margin:0;
    background:rgba(5,5,5,0.96);
    font-size:12px;
    font-weight:900;
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    box-sizing:border-box;
      display:none !important;
}
body.overlay-mode #overlayLead{
    display:none !important;
}

/* OVERLAY CARD */

body.overlay-mode .container > .card{
    display:none;
}

body.overlay-mode .container > .overlay-card{
    display:block;
    background:transparent;
    border:0;
    padding:0;
    margin:0;
}

body.overlay-mode .preview{
    padding:0;
    background:transparent;
}

body.overlay-mode .preview-title{
    display:none;
}


/* CONTROLLER BUTTON */

body.overlay-mode .container > button{
    display:block;
    position:fixed;
    top:10px;
    left:10px;
    z-index:9999;
}
/* PRISM LIVE BOTTOM OVERLAY */

body.overlay-mode{
    margin:0 !important;
    padding:0 !important;
    background:transparent !important;
    overflow:hidden !important;
}

body.overlay-mode .container{

}

body.overlay-mode .container > h1,

body.overlay-mode .container > .card{

body.overlay-mode .overlay-main{

}

body.overlay-mode #overlayTeamA{
    width:25% !important;

    font-size:20px !important;
    font-weight:900 !important;
    text-align:center !important;
}

body.overlay-mode .overlay-score{
    width:22% !important;
    height:100% !important;
    display:flex !important;
    align-items:center !important;
    justify-content:center !important;
    background:#071525 !important;
    border-left:2px solid #168cff !important;
    border-right:2px solid #168cff !important;
}

}

body.overlay-mode #overlayTeamB{
    width:25% !important;
    color:white !important;
    font-size:20px !important;
    font-weight:900 !important;
    text-align:center !important;
}

body.overlay-mode #overlayTimer{
    position:absolute !important;
    left:50% !important;
    bottom:2px !important;
    transform:translateX(-50%) !important;

    background:#075cff !important;
    color:white !important;
    padding:2px 14px !important;
    border-radius:8px 8px 0 0 !important;

    font-size:11px !important;
    font-weight:900 !important;
}

body.overlay-mode #overlayLead{
    width:20% !important;
    color:white !important;
    font-size:12px !important;
    font-weight:900 !important;
    text-align:center !important;
    white-space:nowrap !important;
}

/* SCORE CONTROL FIX */

.score-control-card {
    overflow: hidden;
}

.score-control-card .score-team {
    min-width: 0;
    overflow: hidden;
}

.score-control-card .buttons {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    width: 100%;
}

.score-control-card .buttons button {
    width: 100%;
    min-width: 0;
    max-width: 100%;
    box-sizing: border-box;
    padding: 10px 4px;
    font-size: 14px;
    white-space: normal;
    overflow-wrap: break-word;
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

.player-box{

body.overlay-mode .player-box{

            body.overlay-mode .player-boxes{

</head>

<body>

<div class="container">

    <h1>🏆 KABADDI LIVE SCORE</h1>

    <div class="subtitle">
        Live Match Scoring & Streaming Overlay
    </div>


    <!-- TEAM & PLAYER SETTINGS -->

    <div class="card">

        <label>Team A</label>

        <input
            type="text"
            id="teamA"
            value="INDIA"
            placeholder="Team A Name"

        <label>Team B</label>

        <input

        >

        <label>Current Raider</label>

        <input
            type="text"

            placeholder="Raider Name"
        >

        <label>Match Status</label>

        <select id="matchStatus">

            <option value="LIVE">
                LIVE
            </option>

            <option value="HALF TIME">
                HALF TIME
            </option>

            <option value="TIME OUT">
                TIME OUT
            </option>

            <option value="MATCH END">
                MATCH END
            </option>

        </select>

        <label>Half</label>

        <select id="half">

            <option value="1st Half">
                1st Half
            </option>

            <option value="2nd Half">
                2nd Half
            </option>

        </select>

    </div>


    <!-- SCOREBOARD -->

    <div class="card">

        <div class="scoreboard">

            <div class="team">

                <div
                    class="team-name"

                    INDIA
                </div>

                <div
                    class="score"
                    id="scoreA"

                    0
                </div>

            </div>

            <div class="vs">
                VS
            </div>

            <div class="team">

                <div
                    class="team-name"
                    id="nameB"

                    RAJASTHAN
                </div>

                <div
                    class="score"
                    id="scoreB"
                >
                    0
                </div>

            </div>

        </div>

        <div

        </div>

        <div

            <span class="live-dot"></span>

        </div>

    </div>


    <!-- TIMER CONTROLS -->

    <div class="card">

            <button

            </button>

            <button

                ⏸ PAUSE
            </button>

            <button
                class="gray"

                ↻ RESET TIMER
            </button>

        </div>

    </div>


    <!-- SCORE CONTROL -->

<div class="card score-control-card">

    <h3>🎛️ SCORE CONTROL</h3>

    <div style="display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px;">

</div>

            </button>

                </div>

        </div>

    </div>


    <!-- RECENT EVENTS -->

    <div class="card">

        <h3>📋 Recent Events</h3>

        <div id="events">

            <div class="event">
                Match Ready
            </div>

        </div>

    </div>

</div>

let scoreA = 0;
let scoreB = 0;

let history = [];

let raidStatus = "RAID";

let timeLeft = 20 * 60;

let timerInterval = null;


/* GET ELEMENTS */

const teamAInput =

const teamBInput =
    document.getElementById("teamB");

const raiderInput =
    document.getElementById("raider");

const matchStatusInput =
    document.getElementById("matchStatus");

/* FIREBASE LIVE SYNC */
      
let teamAPlayers = [true, true, true, true, true, true, true];
let teamBPlayers = [true, true, true, true, true, true, true];

 
function renderPlayerBoxes() {

    const teamAContainer = document.getElementById("teamAPlayers");
    const teamBContainer = document.getElementById("teamBPlayers");

    if (!teamAContainer || !teamBContainer) return;

    teamAContainer.innerHTML = "";
    teamBContainer.innerHTML = "";

    for (let i = 0; i < 7; i++) {

        const boxA = document.createElement("div");
        boxA.className = "player-box team-a";

        if (!teamAPlayers[i]) {
            boxA.classList.add("out");
            boxA.textContent = "×";
        }

        boxA.onclick = function () {
            teamAPlayers[i] = !teamAPlayers[i];
            renderPlayerBoxes();
            sendMatchData();
        };

        teamAContainer.appendChild(boxA);


        const boxB = document.createElement("div");
        boxB.className = "player-box team-b";

        if (!teamBPlayers[i]) {
            boxB.classList.add("out");
            boxB.textContent = "×";
        }

        boxB.onclick = function () {
            teamBPlayers[i] = !teamBPlayers[i];
            renderPlayerBoxes();
            sendMatchData();
        };

        teamBContainer.appendChild(boxB);
    }
}
renderPlayerBoxes();
      setTimeout(renderPlayerBoxes, 500);
function sendMatchData() {

    matchRef.set({

        teamA: teamAInput.value || "TEAM A",

        teamB: teamBInput.value || "TEAM B",

        scoreA: scoreA,

        scoreB: scoreB,
        teamAPlayers: teamAPlayers,
teamBPlayers: teamBPlayers,
        raider: raiderInput.value || "Raider 1",

        raidStatus: raidStatus,

        timer: timeLeft,

        half: halfInput.value || "1st Half",

        status: matchStatusInput.value || "LIVE",

        timerRunning: timerInterval !== null,

        updatedAt: Date.now()

    });

}


matchRef.on("value", function(snapshot) {

    const data = snapshot.val();

    if (!data) return;
      if (Array.isArray(data.teamAPlayers)) teamAPlayers = data.teamAPlayers;
if (Array.isArray(data.teamBPlayers)) teamBPlayers = data.teamBPlayers;

renderPlayerBoxes();

    document.getElementById("overlayTeamA").innerText =
        data.teamA || "TEAM A";

    document.getElementById("overlayTeamB").innerText =
        data.teamB || "TEAM B";

    document.getElementById("overlayScoreA").innerText =
        data.scoreA ?? 0;

    document.getElementById("overlayScoreB").innerText =
        data.scoreB ?? 0;

    document.getElementById("overlayRaid").innerText =
        data.raidStatus || "RAID";

    document.getElementById("overlayRaider").innerText =
        data.raider || "Raider 1";

    document.getElementById("overlayHalf").innerText =
        data.half || "1st Half";

    document.getElementById("overlayTimer").innerText =
        formatTime(data.timer ?? 1200);

    const a = Number(data.scoreA || 0);
    const b = Number(data.scoreB || 0);
    const teamA = data.teamA || "TEAM A";
    const teamB = data.teamB || "TEAM B";

    document.getElementById("overlayLead").innerText =
        a > b ? teamA + " LEAD +" + (a - b) :
        b > a ? teamB + " LEAD +" + (b - a) :
        "MATCH TIED";

});


function formatTime(totalSeconds) {

    totalSeconds = Math.max(0, Number(totalSeconds) || 0);

    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;

    return String(minutes).padStart(2, "0") + ":" +
           String(seconds).padStart(2, "0");

}






/* ADD SCORE */

function addScore(team, points, type = "RAID") {

    if (team === "A") {
        scoreA += points;
    } else {
        scoreB += points;
    }

    // RAID
    if (type === "RAID") {

        if (team === "A") {

            // B player OUT
            for (let i = 0; i < points; i++) {
                const index = teamBPlayers.indexOf(true);
                if (index !== -1) {
                    teamBPlayers[index] = false;
                }
            }

            // A player REVIVE
            for (let i = 0; i < points; i++) {
                const index = teamAPlayers.indexOf(false);
                if (index !== -1) {
                    teamAPlayers[index] = true;
                }
            }

        } else {

            // A player OUT
            for (let i = 0; i < points; i++) {
                const index = teamAPlayers.lastIndexOf(true);
                if (index !== -1) {
                    teamAPlayers[index] = false;
                }
            }

            // B player REVIVE
            for (let i = 0; i < points; i++) {
                const index = teamBPlayers.lastIndexOf(true);
                if (index !== -1) {
                    teamBPlayers[index] = true;
                }
            }
        }
    }

    // TACKLE
    else if (type === "TACKLE") {

        if (team === "A") {

            const outIndex = teamBPlayers.lastIndexOf(true);
            if (outIndex !== -1) {
                teamBPlayers[outIndex] = false;
            }

            const inIndex = teamAPlayers.indexOf(false);
            if (inIndex !== -1) {
                teamAPlayers[inIndex] = true;
            }

        } else {

            const outIndex = teamBPlayers.lastIndexOf(true);
            if (outIndex !== -1) {
                teamAPlayers[outIndex] = false;
            }

            const inIndex = teamBPlayers.indexOf(false);
            if (inIndex !== -1) {
                teamBPlayers[inIndex] = true;
            }
        }
    }

    // SUPER TACKLE
    else if (type === "SUPER TACKLE") {

        if (team === "A") {

            const outIndex = teamBPlayers.lastIndexOf(true);
            if (outIndex !== -1) {
                teamBPlayers[outIndex] = false;
            }

            const inIndex = teamAPlayers.indexOf(false);
            if (inIndex !== -1) {
                teamAPlayers[inIndex] = true;
            }

        } else {

            const outIndex = teamAPlayers.lastIndexOf(true);
            if (outIndex !== -1) {
                teamAPlayers[outIndex] = false;
            }

            const inIndex = teamBPlayers.indexOf(false);
            if (inIndex !== -1) {
                teamBPlayers[inIndex] = true;
            }
        }
    }

    // ALL OUT
    else if (type === "ALL OUT") {

        if (team === "A") {
            for (let i = 0; i < 7; i++) {
                teamBPlayers[i] = true;
            }
        } else {
            for (let i = 0; i < 7; i++) {
                teamAPlayers[i] = true;
            }
        }
    }

    // SAVE EVENT
    history.push({
        team: team,
        points: points,
        type: type
    });

    if (history.length > 50) {
        history.shift();
    }

    renderPlayerBoxes();
    updateScore();
    updateOverlay();
    renderEvents();
    sendMatchData();
}


/* SAFE RAID */

function safeRaid(team) {

    history.push({
        team: team,
        points: 0,
        type: "SAFE RAID"
    });

    if (history.length > 50) {
        history.shift();
    }

    updateOverlay();
    renderEvents();
    sendMatchData();
}


/* UPDATE SCORE */

function updateScore() {

    document.getElementById("scoreA").innerText = scoreA;

    document.getElementById("scoreB").innerText = scoreB;

    document.getElementById("nameA").innerText =
        teamAInput.value || "TEAM A";

    document.getElementById("nameB").innerText =
        teamBInput.value || "TEAM B";

    document.getElementById("statusText").innerHTML =
        '<span class="live-dot"></span>' +
        matchStatusInput.value;
}
/* SAVE MATCH */

function saveMatch() {

    const match = {

        teamA:
            teamAInput.value || "TEAM A",

        teamB:
            teamBInput.value || "TEAM B",

        scoreA:
            scoreA,

        scoreB:
            scoreB,

        date:
            new Date().toLocaleString(),

        events:
            history

    };


    let savedMatches =
        JSON.parse(
            localStorage.getItem("matchHistory")
            || "[]"
        );


    savedMatches.unshift(match);


    localStorage.setItem(
        "matchHistory",
        JSON.stringify(savedMatches)
    );


    alert("Match successfully saved!");

}


/* RAID STATUS */

function setRaid(status) {

    raidStatus = status;

    document.getElementById(
        "currentRaid"
    ).innerText = status;

    updateOverlay();

    sendMatchData();

}


/* UNDO */

function undo() {

    if (history.length === 0) {

        alert(
            "Undo ke liye koi event nahi hai."
        );

        return;

    }


    const last = history.pop();


    if (last.team === "A") {

        scoreA -= last.points;

    } else {

        scoreB -= last.points;

    }


    if (scoreA < 0) {

        scoreA = 0;

    }


    if (scoreB < 0) {

        scoreB = 0;

    }


    updateScore();

    updateOverlay();

    renderEvents();

    sendMatchData();

}


/* RESET MATCH */

function resetMatch() {

    const confirmReset =
        confirm(
            "Kya aap pura match reset karna chahte hain?"
        );


    if (!confirmReset) {

        return;

    }


    scoreA = 0;

    scoreB = 0;

    history = [];
      teamAPlayers = [true, true, true, true, true, true, true];
teamBPlayers = [true, true, true, true, true, true, true];

    raidStatus = "RAID";

    timeLeft = 20 * 60;


    pauseTimer();


    document.getElementById(
        "currentRaid"
    ).innerText = "RAID";


    updateScore();
renderPlayerBoxes();
    updateTimer();

    updateOverlay();

    renderEvents();

    sendMatchData();

}


/* EVENTS */

function renderEvents() {

    const events =
        document.getElementById("events");


    events.innerHTML = "";


    if (history.length === 0) {

        events.innerHTML =
            '<div class="event">Match Ready</div>';

        return;

    }


    const recent =
        history.slice().reverse();


    recent.forEach(function(item) {

        const teamName =
            item.team === "A"
                ? (teamAInput.value || "TEAM A")
                : (teamBInput.value || "TEAM B");


        const div =
            document.createElement("div");


        div.className = "event";


        div.innerText =
            teamName +
            " +" +
            item.points +
            " — " +
            item.type;


        events.appendChild(div);

    });

}


// =========================
// START TIMER
// =========================

function startTimer() {

    if (timerInterval !== null) {

        return;

    }


    sendMatchData();

    timerInterval =
        setInterval(function() {

            if (timeLeft <= 0) {

                pauseTimer();

                matchStatusInput.value =
                    "HALF TIME";

                updateScore();

                return;

            }


            timeLeft--;

            updateTimer();
            sendMatchData();

        }, 1000);

}


// =========================
// PAUSE TIMER
// =========================

function pauseTimer() {

    if (timerInterval !== null) {

        clearInterval(timerInterval);

        timerInterval = null;

    }

}


// =========================
// RESET TIMER
// =========================

function resetTimer() {

    pauseTimer();

    timeLeft = 20 * 60;

    updateTimer();

    sendMatchData();

}


// =========================
// UPDATE TIMER DISPLAY
// =========================

function updateTimer() {

    const minutes =
        Math.floor(timeLeft / 60);

    const seconds =
        timeLeft % 60;


    document.getElementById("timer").innerText =

        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");

}

// =========================
// UPDATE LIVE OVERLAY
// =========================
// =========================
// CONTROLLER / OVERLAY MODE
// =========================

function toggleOverlayMode() {

    document.body.classList.toggle("overlay-mode");

}
function updateOverlay() {

    document.getElementById("overlayTeamA").innerText =
        teamAInput.value || "TEAM A";


    document.getElementById("overlayTeamB").innerText =
        teamBInput.value || "TEAM B";


    document.getElementById("overlayScoreA").innerText =
    scoreA;

document.getElementById("overlayScoreB").innerText =
    scoreB;
    const lead =
    scoreA > scoreB
        ? teamAInput.value + " LEAD +" + (scoreA - scoreB)
        : scoreB > scoreA
        ? teamBInput.value + " LEAD +" + (scoreB - scoreA)
        : "MATCH TIED";

document.getElementById("overlayLead").innerText =
    lead;
document.getElementById("overlayTimer").innerText =
    document.getElementById("timer").innerText;

    document.getElementById("overlayHalf").innerText =
        halfInput.value;


    document.getElementById("overlayRaid").innerText =
        raidStatus;


    document.getElementById("overlayRaider").innerText =
        raiderInput.value || "Raider";

}


// =========================
// TEAM A NAME CHANGE
// =========================

teamAInput.addEventListener("input", function() {

    updateScore();

    updateOverlay();

    renderEvents();
    sendMatchData();

});


// =========================
// TEAM B NAME CHANGE
// =========================

teamBInput.addEventListener("input", function() {

    updateScore();

    updateOverlay();

    renderEvents();
    sendMatchData();

});


// =========================
// RAIDER CHANGE
// =========================

raiderInput.addEventListener("input", function() {

    updateOverlay();
    sendMatchData();

});


// =========================
// HALF CHANGE
// =========================

halfInput.addEventListener("change", function() {

    updateOverlay();
    sendMatchData();

});


// =========================
// MATCH STATUS CHANGE
// =========================

matchStatusInput.addEventListener("change", function() {

    updateScore();

    updateOverlay();
    sendMatchData();

});


// =========================
// INITIAL LOAD
// =========================

if (new URLSearchParams(window.location.search).get("overlay") === "1") {
    document.body.classList.add("overlay-mode");
}

updateScore();

updateTimer();

updateOverlay();

renderEvents();

</script>
