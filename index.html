<script>
const firebaseConfig = {
    databaseURL: "https://planning-with-ai-948a8-default-rtdb.firebaseio.com/"
};

firebase.initializeApp(firebaseConfig);

const database = firebase.database();

      

      const params = new URLSearchParams(window.location.search);
const IS_OVERLAY_PAGE = params.get("overlay") === "1";

let matchId = params.get("match");

if (!matchId) {
    matchId = localStorage.getItem("kabaddiMatchId");

    if (!matchId) {
        matchId = "MATCH-" + Math.random().toString(36).substring(2, 8).toUpperCase();
        localStorage.setItem("kabaddiMatchId", matchId);
    }
}

const matchRef = database.ref("kabaddiMatches/" + matchId);

console.log("MATCH ID:", matchId);

    // 🔐 APP ACCESS CONTROL
const accessRef = database.ref("appAccess/" + matchId);

accessRef.once("value").then(function(snapshot) {

    if (!snapshot.exists()) {
        accessRef.set("pending");
    }

});

accessRef.on("value", function(snapshot) {

    const access = snapshot.val();

    if (access !== "approved") {

        document.body.innerHTML = `
        <div style="
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#111;
            color:white;
            font-family:Arial;
            text-align:center;
            padding:20px;
            box-sizing:border-box;
        ">
            <div>
                <div style="font-size:55px;">🔒</div>
                <h2>ACCESS PENDING</h2>
                <p>इस App को इस्तेमाल करने के लिए Admin Approval जरूरी है।</p>
                <p>Match ID:</p>
                <strong style="font-size:20px;">${matchId}</strong>
                <p style="color:#aaa;margin-top:20px;">
                    Admin से Access देने के लिए संपर्क करें।
                </p>
            </div>
        </div>
        `;

    }

});  
      
</script>

<script id="final-user-request-script">
(function(){
  function parseMT(v){
    const m=String(v||'').trim().match(/^(\d{1,2}):(\d{2})$/);
    if(!m)return null;
    const min=Number(m[1]), sec=Number(m[2]);
    if(sec>59 || min>99)return null;
    return min*60+sec;
  }
  function applyMT(){
    const input=document.getElementById('matchTimeInput');
    if(!input)return;
    const n=parseMT(input.value);
    if(n===null || n<=0){
      input.value=(typeof formatTime==='function'?formatTime(matchDuration):'20:00');
      alert('Match Time सही format में डालें, जैसे 20:00');
      return;
    }
    matchDuration=n;
    timeLeft=n;
    if(typeof pauseTimer==='function') pauseTimer();
    if(typeof updateTimer==='function') updateTimer();
    if(typeof updateOverlay==='function') updateOverlay();
    if(typeof sendMatchData==='function') sendMatchData();
    input.value=(typeof formatTime==='function'?formatTime(n):String(input.value));
  }
  function init(){
    const btn=document.getElementById('applyMatchTimeBtn');
    const input=document.getElementById('matchTimeInput');
    if(btn)btn.addEventListener('click',applyMT);
    if(input){
      input.addEventListener('keydown',e=>{
        if(e.key==='Enter'){e.preventDefault();applyMT();}
      });
    }
    const sel=document.getElementById('devanagariFontSelectMain');
    if(sel){

      sel.value=saved;

        const f=this.value;
        const map={
          'Noto Sans Devanagari':'Noto+Sans+Devanagari:wght@400;600;700;800;900',
          'Mukta':'Mukta:wght@400;500;600;700;800',

          'Khand':'Khand:wght@400;500;600;700',
          'Noto Serif Devanagari':'Noto+Serif+Devanagari:wght@400;500;600;700;800;900'
        };
        let l=document.getElementById('userFontLink');
        if(!l){l=document.createElement('link');l.id='userFontLink';l.rel='stylesheet';document.head.appendChild(l);}
        l.href='https://fonts.googleapis.com/css2?family='+map[f]+'&display=swap';
        document.documentElement.style.setProperty('--veer-dev-font','"'+f+'", "Noto Sans Devanagari", Mangal, Arial, sans-serif');
        document.querySelectorAll('#overlayTeamA,#overlayTeamB,#nameA,#nameB').forEach(el=>el.style.setProperty('font-family','"'+f+'", "Noto Sans Devanagari", Mangal, Arial, sans-serif','important'));
        localStorage.setItem('veerScoreDevanagariFont',f);
        if(typeof fitTeamNames==='function')setTimeout(fitTeamNames,200);
      });
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

<script>

let scoreA = 0;
let scoreB = 0;

let history = [];

let raidStatus = "RAID";

let matchDuration = 20 * 60;
let timeLeft = matchDuration;

let timerInterval = null;
let show30SecOverlay = false;
      

let teamA30TimeLeft = 30;
let teamB30TimeLeft = 30;

let teamA30Interval = null;
let teamB30Interval = null;

// SAFE RAID / DO-OR-DIE STATE
let safeRaidA = 0;
let safeRaidB = 0;
let activeRaidTeam = null;
let doOrDieTeam = null;
let safeRaidOverlayA = true;
let safeRaidOverlayB = true;


function resetRaidTimer(team) {
    // हर POINT / SAFE RAID पर नया 30 सेकंड का raid शुरू करें
    clearInterval(teamA30Interval);
    clearInterval(teamB30Interval);
    teamA30Interval = null;
    teamB30Interval = null;

    teamA30TimeLeft = 30;
    teamB30TimeLeft = 30;
    activeRaidTeam = team;
    show30SecOverlay = true;
    document.body.classList.add("show-30sec-overlay");

    if (team === "A") {
        teamA30Interval = setInterval(function() {
            teamA30TimeLeft--;
            updateTeamA30Display();
            updateOverlay();
            sendMatchData();

            if (teamA30TimeLeft <= 0) {
                clearInterval(teamA30Interval);
                teamA30Interval = null;
                activeRaidTeam = null;
                updateOverlay();
                sendMatchData();
            }
        }, 1000);
    } else {
        teamB30Interval = setInterval(function() {
            teamB30TimeLeft--;
            updateTeamB30Display();
            updateOverlay();
            sendMatchData();

            if (teamB30TimeLeft <= 0) {
                clearInterval(teamB30Interval);
                teamB30Interval = null;
                activeRaidTeam = null;
                updateOverlay();
                sendMatchData();
            }
        }, 1000);
    }

    updateTeamA30Display();
    updateTeamB30Display();
    updateOverlay();
    sendMatchData();
}

function startTeamA30SecTimer() {
    if (teamA30Interval) {
        clearInterval(teamA30Interval);
        teamA30Interval = null;
        updateOverlay();
        sendMatchData();
        return;
    }

    clearInterval(teamB30Interval);
    teamB30Interval = null;
    teamB30TimeLeft = 30;

    teamA30TimeLeft = 30;
    activeRaidTeam = "A";
    doOrDieTeam = safeRaidA >= 2 ? "A" : null;
    show30SecOverlay = true;
    document.body.classList.add("show-30sec-overlay");

    updateTeamA30Display();
    updateTeamB30Display();
    updateOverlay();
    sendMatchData();

    teamA30Interval = setInterval(function() {
        teamA30TimeLeft--;
        updateTeamA30Display();
        updateOverlay();
        sendMatchData();

        if (teamA30TimeLeft <= 0) {
            clearInterval(teamA30Interval);
            teamA30Interval = null;
            activeRaidTeam = null;
            updateOverlay();
            sendMatchData();
        }
    }, 1000);
}

function startTeamB30SecTimer() {
    if (teamB30Interval) {
        clearInterval(teamB30Interval);
        teamB30Interval = null;
        updateOverlay();
        sendMatchData();
        return;
    }

    clearInterval(teamA30Interval);
    teamA30Interval = null;
    teamA30TimeLeft = 30;

    teamB30TimeLeft = 30;
    activeRaidTeam = "B";
    doOrDieTeam = safeRaidB >= 2 ? "B" : null;
    show30SecOverlay = true;
    document.body.classList.add("show-30sec-overlay");

    updateTeamA30Display();
    updateTeamB30Display();
    updateOverlay();
    sendMatchData();

    teamB30Interval = setInterval(function() {
        teamB30TimeLeft--;
        updateTeamB30Display();
        updateOverlay();
        sendMatchData();

        if (teamB30TimeLeft <= 0) {
            clearInterval(teamB30Interval);
            teamB30Interval = null;
            activeRaidTeam = null;
            updateOverlay();
            sendMatchData();
        }
    }, 1000);
}

function updateTeamA30Display() {

    const button =
        document.getElementById("teamA30SecBtn");

    const overlay =
        document.getElementById("overlayTimerA");

    if (button)
        button.innerText =
            "⏱️ TEAM A — " + teamA30TimeLeft;

    if (overlay)
        overlay.innerText =
            teamA30TimeLeft;
}


function updateTeamB30Display() {

    const button =
        document.getElementById("teamB30SecBtn");

    const overlay =
        document.getElementById("overlayTimerB");

    if (button)
        button.innerText =
            "⏱️ TEAM B — " + teamB30TimeLeft;

    if (overlay)
        overlay.innerText =
            teamB30TimeLeft;
}
      

/* GET ELEMENTS */

const teamAInput =
    document.getElementById("teamA");

const teamBInput =
    document.getElementById("teamB");

const raiderInput =
    document.getElementById("raider");

const matchStatusInput =
    document.getElementById("matchStatus");

const halfInput =
    document.getElementById("half");
const matchTimeInput =
    document.getElementById("matchTimeInput");

function parseMatchTime(value) {
    const m = String(value || "20:00").trim().match(/^(\d{1,2}):(\d{2})$/);
    if (!m) return null;
    const minutes = Number(m[1]);
    const seconds = Number(m[2]);
    if (seconds > 59 || minutes < 0 || minutes > 99) return null;
    return minutes * 60 + seconds;
}

function applyMatchTimeInput() {
    const parsed = parseMatchTime(matchTimeInput ? matchTimeInput.value : "20:00");
    if (parsed === null || parsed <= 0) {
        if (matchTimeInput) matchTimeInput.value = formatTime(matchDuration);
        return;
    }
    matchDuration = parsed;
    timeLeft = parsed;
    updateTimer();
    updateOverlay();
    sendMatchData();
}



/* FIREBASE LIVE SYNC */
      
let teamAPlayers = [true, true, true, true, true, true, true];
let teamBPlayers = [true, true, true, true, true, true, true];

 
function renderPlayerBoxes() {

    const teamAContainer = document.getElementById("teamAPlayers");
    const teamBContainer = document.getElementById("teamBPlayers");

    if (!teamAContainer || !teamBContainer) return;

    teamAContainer.innerHTML = "";
    teamBContainer.innerHTML = "";

    for (let i = 0; i < 7; i++) {

        const boxA = document.createElement("div");
          boxA.textContent = 7 - i;
        boxA.className = "player-box team-a";

        if (!teamAPlayers[i]) {
    boxA.classList.add("out");
    boxA.textContent = 7 - i;
        }

        boxA.onclick = function () {
            teamAPlayers[i] = !teamAPlayers[i];
            renderPlayerBoxes();
            sendMatchData();
        };

        teamAContainer.appendChild(boxA);


        const boxB = document.createElement("div");
boxB.className = "player-box team-b";
boxB.textContent = i + 1;

if (!teamBPlayers[i]) {
    boxB.classList.add("out");
    boxB.textContent = i + 1;
}

        boxB.onclick = function () {
            teamBPlayers[i] = !teamBPlayers[i];
            renderPlayerBoxes();
            sendMatchData();
        };

        teamBContainer.appendChild(boxB);
    }
}
renderPlayerBoxes();
      setTimeout(renderPlayerBoxes, 500);
      
function sendMatchData() {

    // The overlay is READ-ONLY. It must never overwrite the controller's team names, score or timer with its default values.
    if (IS_OVERLAY_PAGE) return;

    matchRef.set({

        teamA: teamAInput.value,

        teamB: teamBInput.value,

        scoreA: scoreA,

        scoreB: scoreB,

        teamAPlayers: teamAPlayers,

        teamBPlayers: teamBPlayers,

        raider: raiderInput.value || "Raider 1",

        raidStatus: raidStatus,

        timer: timeLeft,
          matchDuration: matchDuration,

        half: halfInput.value || "1st Half",

        status: matchStatusInput.value || "LIVE",

        timerRunning: timerInterval !== null,

        show30SecOverlay: show30SecOverlay,

        teamA30TimeLeft: teamA30TimeLeft,

        teamB30TimeLeft: teamB30TimeLeft,

        teamA30Running: teamA30Interval !== null,

        teamB30Running: teamB30Interval !== null,

        safeRaidA: safeRaidA,
        safeRaidB: safeRaidB,
        activeRaidTeam: activeRaidTeam,
        doOrDieTeam: doOrDieTeam,

        updatedAt: Date.now()

    });

}


matchRef.on("value", function(snapshot) {

    const data = snapshot.val();
      if (!data) return;

      if (data.matchDuration != null) {
          matchDuration = Number(data.matchDuration) || (20 * 60);
          if (matchTimeInput) matchTimeInput.value = formatTime(matchDuration);
      }

      show30SecOverlay = data.show30SecOverlay || false;
      if (typeof data.safeRaidOverlayA === "boolean") safeRaidOverlayA = data.safeRaidOverlayA;
      if (typeof data.safeRaidOverlayB === "boolean") safeRaidOverlayB = data.safeRaidOverlayB;

document.body.classList.toggle("show-30sec-overlay", show30SecOverlay);

      teamA30TimeLeft = data.teamA30TimeLeft ?? 30;
teamB30TimeLeft = data.teamB30TimeLeft ?? 30;

safeRaidA = Number(data.safeRaidA ?? 0);
safeRaidB = Number(data.safeRaidB ?? 0);
activeRaidTeam = data.activeRaidTeam || null;
doOrDieTeam = data.doOrDieTeam || null;

updateTeamA30Display();
updateTeamB30Display();

      

    if (!data) return;
      // Firebase state must also update the local variables used by updateOverlay().
      if (data.scoreA != null) scoreA = Number(data.scoreA) || 0;
      if (data.scoreB != null) scoreB = Number(data.scoreB) || 0;
      if (data.timer != null) timeLeft = Number(data.timer) || 0;
      if (data.raidStatus != null) raidStatus = String(data.raidStatus);
      if (data.raider != null && raiderInput) raiderInput.value = String(data.raider);

    if (Array.isArray(data.teamAPlayers)) teamAPlayers = data.teamAPlayers;
if (Array.isArray(data.teamBPlayers)) teamBPlayers = data.teamBPlayers;

renderPlayerBoxes();

    // Firebase is the single source of truth for team names.
    if (data.teamA != null) {
        teamAInput.value = String(data.teamA);
    }
    if (data.teamB != null) {
        teamBInput.value = String(data.teamB);
    }

    const overlayTeamAEl = document.getElementById("overlayTeamA");
    const overlayTeamBEl = document.getElementById("overlayTeamB");
    if (overlayTeamAEl) overlayTeamAEl.textContent =
        String(data.teamA || "TEAM A");
    if (overlayTeamBEl) overlayTeamBEl.textContent =
        String(data.teamB || "TEAM B");

    document.getElementById("overlayScoreA").innerText =
        data.scoreA ?? 0;

    document.getElementById("overlayScoreB").innerText =
        data.scoreB ?? 0;

    updateOverlay();
});


function formatTime(totalSeconds) {

    totalSeconds = Math.max(0, Number(totalSeconds) || 0);

    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;

    return String(minutes).padStart(2, "0") + ":" +
           String(seconds).padStart(2, "0");

}







/* AUTO REVIVE ALL 7 PLAYERS AFTER ALL 7 ARE OUT */
function autoReviveIfAllOut(team) {
    const players = team === "A" ? teamAPlayers : teamBPlayers;
    if (players.length === 7 && players.every(p => p === false)) {
        for (let i = 0; i < 7; i++) players[i] = true;
        return true;
    }
    return false;
}

/* ADD SCORE */

function addScore(team, points, type = "RAID") {

    // किसी भी POINT / RAID / BONUS / TACKLE क्लिक पर 30 सेकंड फिर से 30 करें
    resetRaidTimer(team);

    // Any scored raid completes the current raid and resets that team's
    // safe-raid counter. The next raid starts a fresh safe-raid cycle.
    if (type === "RAID") {
        if (team === "A") {
            safeRaidA = 0;
        } else {
            safeRaidB = 0;
        }
        doOrDieTeam = null;
        activeRaidTeam = null;
    }

    if (team === "A") {
        scoreA += points;
    } else {
        scoreB += points;
    }

    // RAID
    if (type === "RAID") {

        if (team === "A") {

            // B player OUT
            for (let i = 0; i < points; i++) {
                const index = teamBPlayers.lastIndexOf(true);
                if (index !== -1) {
                    teamBPlayers[index] = false;
                }
            }

            // A player REVIVE
            for (let i = 0; i < points; i++) {
                const index = teamAPlayers.lastIndexOf(false);
                if (index !== -1) {
                    teamAPlayers[index] = true;
                }
            }

        } else {

            // A player OUT
            for (let i = 0; i < points; i++) {
                const index = teamAPlayers.indexOf(true);
                if (index !== -1) {
                    teamAPlayers[index] = false;
                }
            }

            // B player REVIVE
            for (let i = 0; i < points; i++) {
                const index = teamBPlayers.lastIndexOf(false);
                if (index !== -1) {
                    teamBPlayers[index] = true;
                }
            }
        }

        // When all 7 players of the defending team are OUT,
        // automatically revive all 7 back to GREEN.
        if (team === "A") {
            autoReviveIfAllOut("B");
        } else {
            autoReviveIfAllOut("A");
        }
    }

    // TACKLE
    else if (type === "TACKLE") {

        if (team === "A") {

            const outIndex = teamBPlayers.lastIndexOf(true);
            if (outIndex !== -1) {
                teamBPlayers[outIndex] = false;
            }

            const inIndex = teamAPlayers.indexOf(false);
            if (inIndex !== -1) {
                teamAPlayers[inIndex] = true;
            }

        } else {

            const outIndex = teamAPlayers.indexOf(true);
if (outIndex !== -1) {
    teamAPlayers[outIndex] = false;
}

const inIndex = teamBPlayers.lastIndexOf(false);
if (inIndex !== -1) {
    teamBPlayers[inIndex] = true;
}
        }
    }

    // SUPER TACKLE
    else if (type === "SUPER TACKLE") {

        if (team === "A") {

            const outIndex = teamBPlayers.lastIndexOf(true);
            if (outIndex !== -1) {
                teamBPlayers[outIndex] = false;
            }

            const inIndex = teamAPlayers.indexOf(false);
            if (inIndex !== -1) {
                teamAPlayers[inIndex] = true;
            }

        } else {

            const outIndex = teamAPlayers.indexOf(true);
if (outIndex !== -1) {
    teamAPlayers[outIndex] = false;
}

const inIndex = teamBPlayers.lastIndexOf(false);
if (inIndex !== -1) {
    teamBPlayers[inIndex] = true;
}
        }
    }

    // ALL OUT
    else if (type === "ALL OUT") {

        if (team === "A") {
            for (let i = 0; i < 7; i++) {
                teamBPlayers[i] = true;
            }
        } else {
            for (let i = 0; i < 7; i++) {
                teamAPlayers[i] = true;
            }
        }
    }

    // SAVE EVENT
    history.push({
        team: team,
        points: points,
        type: type
    });

    if (history.length > 50) {
        history.shift();
    }

    // UPDATE DISPLAY
    updateScore();
    renderPlayerBoxes();
    updateOverlay();
    renderEvents();
    sendMatchData();

}

function safeRaid(team) {
    // SAFE RAID क्लिक होते ही 30 सेकंड का नया raid timer शुरू करें
    resetRaidTimer(team);

    // If two safe raids are already complete, the next raid is DO-OR-DIE.
    if (team === "A") {
        if (safeRaidA >= 2) {
            doOrDieTeam = "A";
            activeRaidTeam = "A";
            updateOverlay();
            sendMatchData();
            return;
        }
        safeRaidA++;
    } else {
        if (safeRaidB >= 2) {
            doOrDieTeam = "B";
            activeRaidTeam = "B";
            updateOverlay();
            sendMatchData();
            return;
        }
        safeRaidB++;
    }

    doOrDieTeam = null;
    activeRaidTeam = team;
    history.push({
        team: team,
        points: 0,
        type: "SAFE RAID",
        safeRaid: true
    });

    if (history.length > 50) history.shift();

    updateOverlay();
    renderEvents();
    sendMatchData();
}

function updateScore() {

    document.getElementById("scoreA").innerText = scoreA;

    document.getElementById("scoreB").innerText = scoreB;

    document.getElementById("nameA").innerText =
        teamAInput.value || "TEAM A";

    document.getElementById("nameB").innerText =
        teamBInput.value || "TEAM B";

    document.getElementById("statusText").innerHTML =
        '<span class="live-dot"></span>' +
        matchStatusInput.value;
}
/* SAVE MATCH */

function saveMatch() {

    const match = {

        teamA:
            teamAInput.value || "TEAM A",

        teamB:
            teamBInput.value || "TEAM B",

        scoreA:
            scoreA,

        scoreB:
            scoreB,

        date:
            new Date().toLocaleString(),

        events:
            history

    };


    let savedMatches =
        JSON.parse(
            localStorage.getItem("matchHistory")
            || "[]"
        );


    savedMatches.unshift(match);


    localStorage.setItem(
        "matchHistory",
        JSON.stringify(savedMatches)
    );


    alert("Match successfully saved!");

}


/* RAID STATUS */

function setRaid(status) {

    raidStatus = status;

    if (status === "EMPTY RAID" || status === "TACKLE" ||
        status === "SUPER TACKLE") {
        doOrDieTeam = null;
        activeRaidTeam = null;
    }

    document.getElementById(
        "currentRaid"
    ).innerText = status;

    updateOverlay();

    sendMatchData();

}


/* UNDO */

function undo() {

    if (history.length === 0) {

        alert(
            "Undo ke liye koi event nahi hai."
        );

        return;

    }


    const last = history.pop();


    if (last.team === "A") {

        scoreA -= last.points;
        if (last.safeRaid) safeRaidA = Math.max(0, safeRaidA - 1);

    } else {

        scoreB -= last.points;
        if (last.safeRaid) safeRaidB = Math.max(0, safeRaidB - 1);

    }

    doOrDieTeam = null;
    activeRaidTeam = null;


    if (scoreA < 0) {

        scoreA = 0;

    }


    if (scoreB < 0) {

        scoreB = 0;

    }


    updateScore();

    updateOverlay();

    renderEvents();

    sendMatchData();

}


/* RESET MATCH */

function resetMatch() {

    const confirmReset =
        confirm(
            "Kya aap pura match reset karna chahte hain?"
        );


    if (!confirmReset) {

        return;

    }


    scoreA = 0;

    scoreB = 0;

    history = [];
      teamAPlayers = [true, true, true, true, true, true, true];
teamBPlayers = [true, true, true, true, true, true, true];

    raidStatus = "RAID";

    safeRaidA = 0;
    safeRaidB = 0;
    activeRaidTeam = null;
    doOrDieTeam = null;

    timeLeft = matchDuration;


    pauseTimer();


    document.getElementById(
        "currentRaid"
    ).innerText = "RAID";


    updateScore();
renderPlayerBoxes();
    updateTimer();

    updateOverlay();

    renderEvents();

    sendMatchData();

}


/* EVENTS */

function renderEvents() {

    const events =
        document.getElementById("events");


    events.innerHTML = "";


    if (history.length === 0) {

        events.innerHTML =
            '<div class="event">Match Ready</div>';

        return;

    }


    const recent =
        history.slice().reverse();


    recent.forEach(function(item) {

        const teamName =
            item.team === "A"
                ? (teamAInput.value || "TEAM A")
                : (teamBInput.value || "TEAM B");


        const div =
            document.createElement("div");


        div.className = "event";


        div.innerText =
            teamName +
            " +" +
            item.points +
            " — " +
            item.type;


        events.appendChild(div);

    });

}


// =========================
// START TIMER
// =========================

function startTimer() {

    if (timerInterval !== null) {

        return;

    }


    sendMatchData();

    timerInterval =
        setInterval(function() {

            if (timeLeft <= 0) {

                pauseTimer();

                matchStatusInput.value =
                    "HALF TIME";

                updateScore();

                return;

            }


            timeLeft--;

            updateTimer();
            sendMatchData();

        }, 1000);

}


// =========================
// PAUSE TIMER
// =========================

function pauseTimer() {

    if (timerInterval !== null) {

        clearInterval(timerInterval);

        timerInterval = null;

    }

}


// =========================
// RESET TIMER
// =========================

function resetTimer() {

    pauseTimer();

    timeLeft = matchDuration;

    updateTimer();

    sendMatchData();

}


// =========================
// UPDATE TIMER DISPLAY
// =========================

function updateTimer() {

    const minutes =
        Math.floor(timeLeft / 60);

    const seconds =
        timeLeft % 60;


    document.getElementById("timer").innerText =

        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");

}

// =========================

function toggleOverlayMode() {

    document.body.classList.toggle("overlay-mode");

}
function toggleSafeRaidOverlayGlobal() {
    safeRaidOverlayA = true;
    safeRaidOverlayB = true;
    updateOverlay();
    sendMatchData();
}

// Backward-compatible helper if an older control calls it.
function toggleSafeRaidOverlay(team) {
    toggleSafeRaidOverlayGlobal();
}

function undoTeamScore(team) {
    if (team === "A") {
        if (scoreA <= 0) { alert("Team A ka score 0 hai."); return; }
        scoreA = Math.max(0, scoreA - 1);
    } else {
        if (scoreB <= 0) { alert("Team B ka score 0 hai."); return; }
        scoreB = Math.max(0, scoreB - 1);
    }

    // Remove the latest scoring event for this team when possible.
    for (let i = history.length - 1; i >= 0; i--) {
        if (history[i].team === team && Number(history[i].points || 0) > 0) {
            if (history[i].points > 1) history[i].points -= 1;
            else history.splice(i, 1);
            break;
        }
    }

    updateScore();
    updateOverlay();
    renderEvents();
    sendMatchData();
}

function updateOverlay() {
    show30SecOverlay = true;
    document.body.classList.add("show-30sec-overlay");
    const teamAName = teamAInput.value;
    const teamBName = teamBInput.value;

    const teamAEl = document.getElementById("overlayTeamA");
    const teamBEl = document.getElementById("overlayTeamB");

    if (teamAEl) {
        teamAEl.innerText =
            doOrDieTeam === "A" ? "🛑 DO-OR-DIE RAID" : teamAName;
    }

    if (teamBEl) {
        teamBEl.innerText =
            doOrDieTeam === "B" ? "🛑 DO-OR-DIE RAID" : teamBName;
    }

    document.getElementById("overlayScoreA").innerText = scoreA;
    document.getElementById("overlayScoreB").innerText = scoreB;

    const matchTimeEl = document.getElementById("overlayMatchTime");
    if (matchTimeEl) matchTimeEl.innerText = formatTime(timeLeft);

    const safeAEl = document.getElementById("safeRaidA");
    const safeBEl = document.getElementById("safeRaidB");
    const boxA = document.getElementById("safeRaidBoxA");
    const boxB = document.getElementById("safeRaidBoxB");

    if (safeAEl) safeAEl.innerText = safeRaidA;
    if (safeBEl) safeBEl.innerText = safeRaidB;

    if (boxA) {
        boxA.classList.toggle("warning", safeRaidA === 2);
        boxA.classList.toggle("danger", doOrDieTeam === "A");
    }
    if (boxB) {
        boxB.classList.toggle("warning", safeRaidB === 2);
        boxB.classList.toggle("danger", doOrDieTeam === "B");
    }

    const center = document.querySelector(".overlay-center");
    const dodLabel = document.getElementById("doOrDieLabel");

    if (center) center.classList.toggle("do-or-die-active", !!doOrDieTeam);
    if (dodLabel) dodLabel.innerText = doOrDieTeam ? "🛑 DO-OR-DIE RAID" : "";

    const mainTimer = document.getElementById("overlayTimerMain");
    if (mainTimer) {
        mainTimer.innerText =
            activeRaidTeam === "A" ? teamA30TimeLeft :
            activeRaidTeam === "B" ? teamB30TimeLeft : 30;
    }

    const boxAVisible = safeRaidOverlayA;
    const boxBVisible = safeRaidOverlayB;
    if (boxA) boxA.classList.toggle("is-hidden", !boxAVisible);
    if (boxB) boxB.classList.toggle("is-hidden", !boxBVisible);

}

    url.search = "";

    url.searchParams.set("match", matchId);
    url.searchParams.set("overlay", "1");

    return url.toString();
}


function showOverlayLink() {

    const link = getOverlayLink();

    document.getElementById("overlayLink").value = link;

    document.getElementById("overlayLinkBox").style.display = "block";
}


function copyOverlayLink() {

    const link = document.getElementById("overlayLink").value;

    navigator.clipboard.writeText(link).then(function() {

        alert("Overlay link copied!");

    }).catch(function() {

        document.getElementById("overlayLink").select();

        document.execCommand("copy");

        alert("Overlay link copied!");

    });
}


function openOverlay() {

}

#veerFontControlMain label{font-size:13px;font-weight:900;color:#fff;white-space:nowrap;}
#veerFontSelectMain{
  flex:1;
  min-width:0;
  padding:8px 10px;
  border-radius:7px;
  border:1px solid #aaa;
  background:#fff;
  color:#111;
  font-size:14px;
  font-weight:700;
}
@media(max-width:600px){
  #veerFontControlMain{margin:6px 0 10px;}
  #veerFontControlMain label{font-size:12px;}
  #veerFontSelectMain{font-size:13px;}
}
</style>
<script id="final-request-script-2">
(function(){
  const fontMap={
    "Noto Sans Devanagari":"Noto+Sans+Devanagari:wght@400;600;700;800;900",
    "Mukta":"Mukta:wght@400;500;600;700;800",
    "Hind":"Hind:wght@400;500;600;700",
    "Khand":"Khand:wght@400;500;600;700",
    "Noto Serif Devanagari":"Noto+Serif+Devanagari:wght@400;500;600;700;800;900"
  };
  const fontNames=Object.keys(fontMap);

  function loadFont(font){
    if(!fontMap[font]) font="Noto Sans Devanagari";
    let link=document.getElementById('veerDynamicFont');
    if(!link){
      link=document.createElement('link');
      link.id='veerDynamicFont';
      link.rel='stylesheet';
      document.head.appendChild(link);
    }
    link.href='https://fonts.googleapis.com/css2?family='+fontMap[font]+'&display=swap';
    document.documentElement.style.setProperty('--veer-dev-font','"'+font+'", "Noto Sans Devanagari", Mangal, Arial, sans-serif');
    document.querySelectorAll('#overlayTeamA,#overlayTeamB,#nameA,#nameB').forEach(function(el){
      el.style.setProperty('font-family','"'+font+'", "Noto Sans Devanagari", Mangal, Arial, sans-serif','important');
    });
    localStorage.setItem('veerScoreDevanagariFont',font);
    setTimeout(fitTeamNames,250);
  }

  function fitOne(el){
    if(!el || !el.textContent.trim()) return;
    // Start large, then reduce only when the text does not fit.
    let size=Math.min(34, Math.max(16, parseFloat(getComputedStyle(el).fontSize)||24));
    el.style.fontSize=size+'px';
    let guard=0;
    while(guard++<30 && (el.scrollWidth>el.clientWidth+1 || el.scrollHeight>el.clientHeight+1) && size>10){
      size-=1;
      el.style.fontSize=size+'px';
    }
  }
  function fitTeamNames(){
    fitOne(document.getElementById('overlayTeamA'));
    fitOne(document.getElementById('overlayTeamB'));
  }

  function addFontControl(){
    // Font control is already placed once inside MATCH CONTROLS.
    // Never create another copy.
    const sel=document.getElementById('devanagariFontSelectMain');
    if(!sel) return;
    const saved=localStorage.getItem('veerScoreDevanagariFont')||'Noto Sans Devanagari';
    sel.value=saved;
    sel.onchange=function(){loadFont(this.value);};
    loadFont(saved);
    fitTeamNames();
  }
  function init(){
    addFontControl();
    fitTeamNames();
    window.addEventListener('resize',fitTeamNames);
    // Team names can change after Firebase updates.
    const obs=new MutationObserver(function(muts){
      let changed=false;
      muts.forEach(function(m){if(m.target && (m.target.id==='overlayTeamA'||m.target.id==='overlayTeamB')) changed=true;});
      if(changed) setTimeout(fitTeamNames,20);
    });
    ['overlayTeamA','overlayTeamB'].forEach(function(id){
      const el=document.getElementById(id); if(el) obs.observe(el,{childList:true,characterData:true,subtree:true});
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
})();
</script>
</html>
