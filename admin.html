<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kabaddi Admin Panel</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    padding:15px;
}

h1{
    text-align:center;
}

.card{
    background:#222;
    padding:16px;
    margin:12px 0;
    border-radius:12px;
}

.match{
    border:1px solid #444;
}

button{
    border:0;
    border-radius:8px;
    padding:13px 18px;
    margin:5px 3px;
    font-weight:bold;
    color:white;
}

.approve{
    background:#20c76a;
}

.reject{
    background:#e53935;
}

.status{
    font-weight:bold;
}

.pending{
    color:#ffc107;
}

.approved{
    color:#20c76a;
}

.rejected{
    color:#e53935;
}
</style>
</head>

<body>

<h1>🔐 Kabaddi Admin Panel</h1>

<div class="card">
    <h3>📋 Access Requests</h3>
    <p>यहाँ नए devices की requests दिखाई देंगी।</p>
</div>

<div id="accessList">
    Loading...
</div>


<script>

const firebaseConfig = {

    apiKey: "AIzaSyCfv14u8senEoaN_WiCsSVG2h9G0GaAPpM",

    authDomain:
    "planning-with-ai-948a8.firebaseapp.com",

    databaseURL:
    "https://planning-with-ai-948a8-default-rtdb.firebaseio.com",

    projectId:
    "planning-with-ai-948a8",

    storageBucket:
    "planning-with-ai-948a8.firebasestorage.app",

    messagingSenderId:
    "632799487557",

    appId:
    "1:632799487557:web:f0168acbb37fe9c171a52c"

};


firebase.initializeApp(firebaseConfig);


const database =
    firebase.database();

const accessRef =
    database.ref("appAccess");


function loadAccess(){

    accessRef.on("value", function(snapshot){

        const data =
            snapshot.val();

        const list =
            document.getElementById("accessList");

        list.innerHTML = "";


        if(!data){

            list.innerHTML = `
                <div class="card">
                    कोई Access Request नहीं है।
                </div>
            `;

            return;
        }


        Object.keys(data).forEach(function(matchId){

            const status =
                data[matchId];


            const card =
                document.createElement("div");

            card.className =
                "card match";


            let statusClass = "";

            if(status === "pending"){
                statusClass = "pending";
            }

            if(status === "approved"){
                statusClass = "approved";
            }

            if(status === "rejected"){
                statusClass = "rejected";
            }


            card.innerHTML = `

                <h2>📱 ${matchId}</h2>

                <p>
                    Status:
                    <span class="status ${statusClass}">
                        ${status}
                    </span>
                </p>

                <button
                    class="approve"
                    onclick="approveAccess('${matchId}')">
                    ✅ APPROVE
                </button>

                <button
                    class="reject"
                    onclick="rejectAccess('${matchId}')">
                    ❌ REJECT
                </button>

            `;


            list.appendChild(card);

        });

    });

}


function approveAccess(matchId){

    database
        .ref("appAccess/" + matchId)
        .set("approved");

}


function rejectAccess(matchId){

    database
        .ref("appAccess/" + matchId)
        .set("rejected");

}


loadAccess();

</script>

</body>
</html>
