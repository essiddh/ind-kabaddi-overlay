<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kabaddi Admin Panel</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}
h1{
    text-align:center;
}
.card{
    background:#222;
    padding:15px;
    margin:12px 0;
    border-radius:12px;
}
input{
    width:100%;
    padding:14px;
    box-sizing:border-box;
    border-radius:8px;
    border:1px solid #555;
    background:#333;
    color:white;
    margin:10px 0;
    font-size:16px;
}
button{
    border:0;
    border-radius:8px;
    padding:12px 18px;
    margin:5px;
    font-weight:bold;
    cursor:pointer;
}
.login{
    background:#168cff;
    color:white;
    width:100%;
}
.approve{
    background:#20c76a;
    color:white;
}
.reject{
    background:#e53935;
    color:white;
}
.status{
    font-weight:bold;
}
#adminPanel{
    display:none;
}
</style>
</head>

<body>

<div id="loginBox" class="card">

    <h1>🔐 Admin Login</h1>

    <input
        type="password"
        id="adminPassword"
        placeholder="Enter Admin Password"
    >

    <button class="login" onclick="loginAdmin()">
        🔓 LOGIN
    </button>

    <p id="loginMessage"></p>

</div>


<div id="adminPanel">

    <h1>🔐 Kabaddi Admin Panel</h1>

    <div id="accessList">
        Loading...
    </div>

</div>


<script>

const firebaseConfig = {
    databaseURL: "https://planning-with-ai-948a8-default-rtdb.firebaseio.com/"
};

firebase.initializeApp(firebaseConfig);

const database = firebase.database();
const accessRef = database.ref("appAccess");


/* 🔑 ADMIN PASSWORD */

const ADMIN_PASSWORD = "KABADDI@123";


function loginAdmin(){

    const password =
        document.getElementById("adminPassword").value;

    if(password === ADMIN_PASSWORD){

        document.getElementById("loginBox").style.display = "none";

        document.getElementById("adminPanel").style.display = "block";

        loadAccess();

    }else{

        document.getElementById("loginMessage").innerText =
            "❌ Wrong Password";

    }

}


function loadAccess(){

    accessRef.on("value", function(snapshot){

        const data = snapshot.val();

        const list =
            document.getElementById("accessList");

        list.innerHTML = "";

        if(!data){

            list.innerHTML =
                "<div class='card'>No access requests.</div>";

            return;
        }


        Object.keys(data).forEach(function(matchId){

            const status = data[matchId];

            const card =
                document.createElement("div");

            card.className = "card";

            card.innerHTML = `

                <h3>📱 ${matchId}</h3>

                <p>
                    Status:
                    <span class="status">${status}</span>
                </p>

                <button
                    class="approve"
                    onclick="approveAccess('${matchId}')">

                    ✅ APPROVE

                </button>

                <button
                    class="reject"
                    onclick="rejectAccess('${matchId}')">

                    ❌ REJECT

                </button>

            `;

            list.appendChild(card);

        });

    });

}


function approveAccess(matchId){

    accessRef
        .child(matchId)
        .set("approved");

}


function rejectAccess(matchId){

    accessRef
        .child(matchId)
        .set("rejected");

}

</script>

</body>
</html>
