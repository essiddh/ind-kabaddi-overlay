<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kabaddi Admin Panel</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}
h1{
    text-align:center;
}
.card{
    background:#222;
    padding:15px;
    margin:12px 0;
    border-radius:12px;
}
button{
    border:0;
    border-radius:8px;
    padding:12px 18px;
    margin:5px;
    font-weight:bold;
    cursor:pointer;
}
.approve{
    background:#20c76a;
    color:white;
}
.reject{
    background:#e53935;
    color:white;
}
.status{
    font-weight:bold;
}
</style>
</head>

<body>

<h1>🔐 Kabaddi Admin Panel</h1>

<div id="accessList">
    Loading...
</div>

<script>

const firebaseConfig = {
    databaseURL: "https://planning-with-ai-948a8-default-rtdb.firebaseio.com/"
};

firebase.initializeApp(firebaseConfig);

const database = firebase.database();
const accessRef = database.ref("appAccess");

function loadAccess(){

    accessRef.on("value", function(snapshot){

        const data = snapshot.val();
        const list = document.getElementById("accessList");

        list.innerHTML = "";

        if(!data){
            list.innerHTML = "<div class='card'>No access requests.</div>";
            return;
        }

        Object.keys(data).forEach(function(matchId){

            const status = data[matchId];

            const card = document.createElement("div");
            card.className = "card";

            card.innerHTML = `
                <h3>📱 ${matchId}</h3>
                <p>Status: <span class="status">${status}</span></p>

                <button class="approve"
                    onclick="approveAccess('${matchId}')">
                    ✅ APPROVE
                </button>

                <button class="reject"
                    onclick="rejectAccess('${matchId}')">
                    ❌ REJECT
                </button>
            `;

            list.appendChild(card);
        });

    });

}

function approveAccess(matchId){

    accessRef.child(matchId).set("approved");

}

function rejectAccess(matchId){

    accessRef.child(matchId).set("rejected");

}

loadAccess();

</script>

</body>
</html>
