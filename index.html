<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IND Cricket Live Overlay</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:transparent;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
    color:white;
}

/* =========================
   MAIN SCORE BAR
========================= */

.score-bar{
    position:absolute;
    top:25px;
    left:50%;
    transform:translateX(-50%);
    width:92%;
    height:92px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(
        90deg,
        rgba(5,10,25,.96),
        rgba(18,28,55,.96),
        rgba(5,10,25,.96)
    );

    border:2px solid rgba(0,180,255,.65);
    border-radius:18px;

    box-shadow:
        0 0 20px rgba(0,180,255,.25),
        inset 0 0 20px rgba(0,0,0,.5);
}

/* TEAM */

.team{
    width:29%;
    text-align:center;
}

.team-name{
    font-size:21px;
    font-weight:900;
    letter-spacing:1px;
}

.score{
    margin-top:5px;
    font-size:31px;
    font-weight:900;
}

.overs{
    font-size:14px;
    color:#b8c7d9;
    margin-top:2px;
}

/* VS */

.vs{
    width:14%;
    text-align:center;
}

.vs-circle{
    width:45px;
    height:45px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#071426;
    border:2px solid #00b4ff;

    font-size:13px;
    font-weight:900;

    box-shadow:0 0 15px rgba(0,180,255,.35);
}

/* =========================
   INFO BAR
========================= */

.info-bar{
    position:absolute;
    top:125px;
    left:50%;
    transform:translateX(-50%);

    width:92%;
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
}

.info-item{
    background:rgba(7,18,38,.95);

    padding:7px 14px;

    border-radius:8px;

    border:1px solid rgba(255,255,255,.12);

    font-size:13px;
    font-weight:800;
}

.live{
    background:#e51d35;
    border-color:#ff4558;

    animation:pulse 1.4s infinite;
}

@keyframes pulse{

    0%{
        opacity:1;
    }

    50%{
        opacity:.65;
    }

    100%{
        opacity:1;
    }

}

/* =========================
   PLAYER STATUS
========================= */

.players{
    position:absolute;

    top:185px;
    left:50%;
    transform:translateX(-50%);

    width:92%;

    display:flex;
    gap:12px;
}

.player-card{

    flex:1;

    min-height:70px;

    padding:10px 14px;

    background:rgba(8,18,38,.94);

    border-radius:12px;

    border:1px solid rgba(255,255,255,.12);

    box-shadow:
        0 4px 12px rgba(0,0,0,.35);
}

.player-title{

    font-size:11px;

    color:#00b4ff;

    font-weight:900;

    letter-spacing:1px;

    margin-bottom:5px;
}

.player-name{

    font-size:16px;

    font-weight:900;
}

.player-stats{

    margin-top:3px;

    font-size:12px;

    color:#cbd5e1;
}

/* =========================
   LAST BALLS
========================= */

.last-balls{

    position:absolute;

    top:270px;
    left:50%;
    transform:translateX(-50%);

    width:92%;

    display:flex;

    align-items:center;

    gap:7px;
}

.last-title{

    font-size:12px;

    font-weight:900;

    margin-right:5px;

    color:#dce7f5;
}

.ball{

    min-width:32px;
    height:32px;

    padding:0 8px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#14223d;

    border:1px solid rgba(255,255,255,.15);

    font-size:12px;

    font-weight:900;
}

.ball-four{
    background:#00b878;
}

.ball-six{
    background:#008cff;
}

.ball-wicket{
    background:#e51d35;
}

.ball-extra{
    background:#d69c00;
}

/* =========================
   BOTTOM IPL STYLE STRIP
========================= */

.bottom-strip{

    position:absolute;

    bottom:28px;
    left:50%;
    transform:translateX(-50%);

    width:92%;
    height:65px;

    display:flex;
    align-items:center;

    background:linear-gradient(
        90deg,
        rgba(4,11,27,.98),
        rgba(12,25,52,.98),
        rgba(4,11,27,.98)
    );

    border-radius:14px;

    border:2px solid rgba(0,180,255,.5);

    overflow:hidden;

    box-shadow:
        0 0 20px rgba(0,0,0,.5);
}

/* LIVE */

.bottom-live{

    height:100%;

    padding:0 18px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#e51d35;

    font-size:14px;

    font-weight:900;

    letter-spacing:1px;
}

/* STRIP ITEMS */

.strip-item{

    flex:1;

    height:100%;

    padding:0 15px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    border-right:1px solid rgba(255,255,255,.1);
}

.strip-label{

    font-size:10px;

    color:#8ea4bf;

    font-weight:800;

    letter-spacing:.8px;

}

.strip-value{

    margin-top:3px;

    font-size:16px;

    font-weight:900;
}

/* =========================
   MATCH STATUS
========================= */

.status-box{

    position:absolute;

    bottom:105px;

    left:50%;

    transform:translateX(-50%);

    width:92%;

    text-align:center;

    font-size:12px;

    font-weight:900;

    letter-spacing:1px;

    color:#9db2c9;
}

/* =========================
   MOBILE / SMALL SCREEN
========================= */

@media(max-width:700px){

    .score-bar{
        top:10px;
        height:80px;
        width:96%;
    }

    .team-name{
        font-size:15px;
    }

    .score{
        font-size:23px;
    }

    .overs{
        font-size:11px;
    }

    .vs-circle{
        width:36px;
        height:36px;
        font-size:10px;
    }

    .info-bar{
        top:98px;
        width:96%;
        gap:5px;
    }

    .info-item{
        padding:6px 8px;
        font-size:10px;
    }

    .players{
        top:145px;
        width:96%;
        gap:5px;
    }

    .player-card{
        min-height:62px;
        padding:7px;
    }

    .player-title{
        font-size:8px;
    }

    .player-name{
        font-size:11px;
    }

    .player-stats{
        font-size:9px;
    }

    .last-balls{
        top:220px;
        width:96%;
    }

    .last-title{
        font-size:9px;
    }

    .ball{
        min-width:25px;
        height:25px;
        font-size:9px;
    }

    .bottom-strip{
        width:96%;
        height:55px;
        bottom:10px;
    }

    .bottom-live{
        padding:0 10px;
        font-size:10px;
    }

    .strip-item{
        padding:0 5px;
    }

    .strip-label{
        font-size:7px;
    }

    .strip-value{
        font-size:11px;
    }

    .status-box{
        bottom:75px;
        font-size:9px;
    }

}

</style>
</head>

<body>

<!-- =========================
     MAIN SCORE
========================= -->

<div class="score-bar">

    <div class="team">

        <div class="team-name" id="teamA">
            TEAM A
        </div>

        <div class="score" id="scoreA">
            0/0
        </div>

        <div class="overs" id="oversA">
            0.0 OVERS
        </div>

    </div>


    <div class="vs">

        <div class="vs-circle">
            VS
        </div>

    </div>


    <div class="team">

        <div class="team-name" id="teamB">
            TEAM B
        </div>

        <div class="score" id="scoreB">
            0/0
        </div>

        <div class="overs" id="oversB">
            0.0 OVERS
        </div>

    </div>

</div>


<!-- =========================
     INFO BAR
========================= -->

<div class="info-bar">

    <div class="info-item live">
        🔴 LIVE
    </div>

    <div class="info-item" id="target">
        TARGET --
    </div>

    <div class="info-item" id="crr">
        CRR 0.00
    </div>

    <div class="info-item" id="rrr">
        RRR 0.00
    </div>

    <div class="info-item" id="overInfo">
        OVER 0.0
    </div>

</div>


<!-- =========================
     PLAYER STATUS
========================= -->

<div class="players">

    <div class="player-card">

        <div class="player-title">
            STRIKER ★
        </div>

        <div class="player-name" id="striker">
            Batter
        </div>

        <div class="player-stats" id="strikerStats">
            0 (0)
        </div>

    </div>


    <div class="player-card">

        <div class="player-title">
            NON-STRIKER
        </div>

        <div class="player-name" id="nonStriker">
            Batter
        </div>

        <div class="player-stats" id="nonStrikerStats">
            0 (0)
        </div>

    </div>


    <div class="player-card">

        <div class="player-title">
            BOWLER
        </div>

        <div class="player-name" id="bowler">
            Bowler
        </div>

        <div class="player-stats" id="bowlerStats">
            0/0
        </div>

    </div>

</div>


<!-- =========================
     LAST BALLS
========================= -->

<div class="last-balls">

    <div class="last-title">
        LAST 5
    </div>

    <div id="ballsContainer"></div>

</div>


<!-- =========================
     MATCH STATUS
========================= -->

<div class="status-box" id="matchStatus">
    1st INNINGS LIVE
</div>


<!-- =========================
     BOTTOM STRIP
========================= -->

<div class="bottom-strip">

    <div class="bottom-live">
        LIVE
    </div>


    <div class="strip-item">

        <div class="strip-label" id="bottomTeam">
            TEAM
        </div>

        <div class="strip-value" id="bottomScore">
            0/0
        </div>

    </div>


    <div class="strip-item">

        <div class="strip-label">
            PARTNERSHIP
        </div>

        <div class="strip-value" id="partnership">
            0
        </div>

    </div>


    <div class="strip-item">

        <div class="strip-label">
            TARGET
        </div>

        <div class="strip-value" id="bottomTarget">
            --
        </div>

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    databaseURL:
        "https://planning-with-ai-948a8-default-rtdb.firebaseio.com/"

};


const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);

const matchRef =
    ref(db, "cricketMatch");


/* =========================
   FIREBASE LISTENER
========================= */

onValue(matchRef, (snapshot) => {

    const d = snapshot.val();

    if (!d) {
        return;
    }


    /* =========================
       TEAM A
    ========================= */

    document.getElementById("teamA").textContent =
        d.teamA || "TEAM A";


    document.getElementById("scoreA").textContent =
        `${Number(d.scoreA || 0)}/${Number(d.wicketsA || 0)}`;


    document.getElementById("oversA").textContent =
        `${d.oversA || "0.0"} OVERS`;


    /* =========================
       TEAM B
    ========================= */

    document.getElementById("teamB").textContent =
        d.teamB || "TEAM B";


    document.getElementById("scoreB").textContent =
        `${Number(d.scoreB || 0)}/${Number(d.wicketsB || 0)}`;


    document.getElementById("oversB").textContent =
        `${d.oversB || "0.0"} OVERS`;


    /* =========================
       CURRENT INNINGS
    ========================= */

    const secondInnings =
        d.secondInnings === true ||
        Number(d.scoreB || 0) > 0 &&
        Number(d.scoreA || 0) > 0;


    let currentRuns = 0;

    let currentWickets = 0;

    let currentOvers = "0.0";


    if (secondInnings) {

        currentRuns =
            Number(d.scoreB || 0);

        currentWickets =
            Number(d.wicketsB || 0);

        currentOvers =
            d.oversB || "0.0";

    } else {

        currentRuns =
            Number(d.scoreA || 0);

        currentWickets =
            Number(d.wicketsA || 0);

        currentOvers =
            d.oversA || "0.0";

    }


    /* =========================
       TARGET
    ========================= */

    const target =
        Number(
            d.target ||
            (
                Number(d.firstInningsRuns || 0) + 1
            )
        );


    if (secondInnings && target > 1) {

        const need =
            Math.max(
                0,
                target - currentRuns
            );


        if (need > 0) {

            document.getElementById("target").textContent =
                `TARGET ${target} • NEED ${need}`;

            document.getElementById("bottomTarget").textContent =
                `${target}`;

        } else {

            document.getElementById("target").textContent =
                `TARGET ${target} • WON 🏆`;

            document.getElementById("bottomTarget").textContent =
                "WON 🏆";

        }

    } else {

        document.getElementById("target").textContent =
            "TARGET --";

        document.getElementById("bottomTarget").textContent =
            "--";

    }


    /* =========================
       CRR
    ========================= */

    const legalBalls =
        Number(d.legalBalls || 0);


    let crr = 0;


    if (legalBalls > 0) {

        crr =
            currentRuns * 6 / legalBalls;

    }


    document.getElementById("crr").textContent =
        `CRR ${crr.toFixed(2)}`;


    /* =========================
       RRR
    ========================= */

    let rrr = 0;


    if (
        secondInnings &&
        target > currentRuns &&
        legalBalls < 120
    ) {

        const runsNeeded =
            target - currentRuns;

        const ballsRemaining =
            120 - legalBalls;


        if (ballsRemaining > 0) {

            rrr =
                runsNeeded * 6 /
                ballsRemaining;

        }

    }


    document.getElementById("rrr").textContent =
        `RRR ${rrr.toFixed(2)}`;


    /* =========================
       OVER
    ========================= */

    document.getElementById("overInfo").textContent =
        `OVER ${currentOvers}`;


    /* =========================
       PLAYER STATUS
    ========================= */

    document.getElementById("striker").textContent =
        d.striker || "Batter";


    document.getElementById("strikerStats").textContent =
        `${Number(d.strikerRuns || 0)} (${Number(d.strikerBalls || 0)})`;


    document.getElementById("nonStriker").textContent =
        d.nonStriker || "Batter";


    document.getElementById("nonStrikerStats").textContent =
        `${Number(d.nonStrikerRuns || 0)} (${Number(d.nonStrikerBalls || 0)})`;


    document.getElementById("bowler").textContent =
        d.bowler || "Bowler";


    document.getElementById("bowlerStats").textContent =
        `${Number(d.bowlerRuns || 0)}/${Number(d.bowlerWickets || 0)}`;


    /* =========================
       MATCH STATUS
    ========================= */

    let status =
        d.matchStatus || "LIVE";


    if (status === "FINISHED") {

        document.getElementById("matchStatus").textContent =
            "MATCH FINISHED";

    } else if (d.halfTime === true) {

        document.getElementById("matchStatus").textContent =
            "HALF TIME";

    } else if (secondInnings) {

        document.getElementById("matchStatus").textContent =
            "2nd INNINGS LIVE";

    } else {

        document.getElementById("matchStatus").textContent =
            "1st INNINGS LIVE";

    }


    /* =========================
       BOTTOM STRIP
    ========================= */

    const currentTeam =
        secondInnings
            ? d.teamB
            : d.teamA;


    document.getElementById("bottomTeam").textContent =
        currentTeam || "TEAM";


    document.getElementById("bottomScore").textContent =
        `${currentRuns}/${currentWickets}`;


    document.getElementById("partnership").textContent =
        `${Number(d.partnershipRuns || 0)} (${Number(d.partnershipBalls || 0)})`;


    /* =========================
       LAST 5 BALLS
    ========================= */

    const container =
        document.getElementById("ballsContainer");


    container.innerHTML = "";


    const history =
        d.ballHistory || [];


    const lastBalls =
        history.slice(-5);


    lastBalls.forEach((value) => {

        const ball =
            document.createElement("span");


        ball.className =
            "ball";


        if (String(value) === "4") {

            ball.classList.add("ball-four");

        } else if (String(value) === "6") {

            ball.classList.add("ball-six");

        } else if (String(value) === "W") {

            ball.classList.add("ball-wicket");

        } else if (
            String(value) === "Wd" ||
            String(value) === "Nb"
        ) {

            ball.classList.add("ball-extra");

        }


        ball.textContent =
            value;


        container.appendChild(ball);

    });

});

</script>

</body>
</html>
